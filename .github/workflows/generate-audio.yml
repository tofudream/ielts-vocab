name: Generate pronunciation audio
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'sample = a few words in two voices, all = every word'
        default: sample
        type: choice
        options: [sample, all]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts
      - run: python data-tools/generate_audio.py ${{ inputs.mode }}
      - name: Commit generated audio
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Generate pronunciation audio (${{ inputs.mode }})"
          git push
